name: Bug Report
description: Report a bug in reaxuse
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: What went wrong? Which hook is affected?
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal reproduction or a link to a playground.
      placeholder: Steps to reproduce, or a StackBlitz/CodeSandbox link.
    validations:
      required: true
  - type: input
    id: system-info
    attributes:
      label: System Info
      description: reaxuse version, React version, Node version, OS.
    validations:
      required: true
